name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: oracle-fusion-erp-catalog-mcp

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: release
        env:
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${EVENT_TAG#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Version must look like 1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Validate package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          actual="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$actual" = "$VERSION" || {
            echo "Tag v${VERSION} does not match Cargo.toml version ${actual}" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: oracle-fusion-erp-catalog-mcp-macos-aarch64
            cross: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: oracle-fusion-erp-catalog-mcp-linux-x86_64
            cross: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: oracle-fusion-erp-catalog-mcp-linux-aarch64
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${{ matrix.asset }}"
          chmod 755 "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum oracle-fusion-erp-catalog-mcp-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
