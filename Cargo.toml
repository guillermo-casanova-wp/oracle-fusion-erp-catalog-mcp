[package]
name = "oracle-fusion-erp-catalog-mcp"
version = "0.1.0"
edition = "2021"
description = "Oracle Fusion ERP Catalog MCP server and lexical RAG technical dictionary"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
indicatif = "0.17"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "io-std", "io-util", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
